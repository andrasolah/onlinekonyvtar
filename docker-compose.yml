services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: onlinekonyvtar_user
      POSTGRES_PASSWORD: onlinekonyvtar_pass
      POSTGRES_DB: onlinekonyvtar_db
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onlinekonyvtar_user -d onlinekonyvtar_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: